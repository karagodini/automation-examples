[tool.pytest.ini_options]
pythonpath = ["price-monitor", "leads-webhook"]
testpaths = ["price-monitor/tests", "leads-webhook/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["price_monitor", "leads_webhook"]
